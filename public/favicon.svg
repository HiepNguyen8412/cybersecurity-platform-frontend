<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- High-Tech Cyber Shield Outer Chassis -->
  <path 
    d="M24 3L40 9V22C40 32.5 33.2 41.5 24 45C14.8 41.5 8 32.5 8 22V9L24 3Z" 
    fill="url(#shieldGrad)" 
    filter="url(#glow)"
  />

  <!-- Subtle Inner Border Highlight -->
  <path 
    d="M24 6L37.5 11.2V22C37.5 30.8 31.8 38.6 24 41.6C16.2 38.6 10.5 30.8 10.5 22V11.2L24 6Z" 
    stroke="rgba(255,255,255,0.25)" 
    stroke-width="1"
    fill="none"
  />

  <!-- High-Tech Central Terminal Node & Chevron Prompt -->
  <path 
    d="M17 17L23 23L17 29" 
    stroke="#ffffff" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Blinking Cursor Node -->
  <line 
    x1="25" y1="28.5" x2="31" y2="28.5" 
    stroke="url(#cyanAccent)" 
    stroke-width="3" 
    stroke-linecap="round"
  />

  <!-- Active Telemetry Radar Ping Dot -->
  <circle cx="28" cy="18" r="2.5" fill="#38bdf8" />
</svg>